<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Klang Valley Commute Map</title>
    <meta name="description" content="See where in the Klang Valley you could live and reach your office or campus by train in 30, 45 or 60 minutes." />
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <h1>Klang Valley commute map</h1>
      <form id="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search your office or campus" aria-label="Search for a destination" />
        <button type="submit">Go</button>
      </form>
      <div id="arrival" role="group" aria-label="Arrival time (weekday)">
        <button type="button" data-window="0800" class="on" aria-pressed="true">Arrive 8:00 am</button>
        <button type="button" data-window="0900" aria-pressed="false">Arrive 9:00 am</button>
      </div>
      <p id="hint">Click the map where you work or study. Shading shows door-to-door train travel time to it.</p>
      <ul id="legend"></ul>
      <p id="status"></p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
